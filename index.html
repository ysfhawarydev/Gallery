<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery">
        <h1>Image Gallery</h1>

        <div class="main-image">
            <img src="images/shoe1.jpg" alt="Main Image" id="mainImg">
        </div>

        <div class="thumbnails">
            <img src="images/shoe1.jpeg" class="thumb active">
            <img src="images/shoe2.jpeg" class="thumb">
            <img src="images/shoe3.jpeg" class="thumb">
            <img src="images/shoe4.jpeg" class="thumb">
            <img src="images/shoe5.jpeg" class="thumb">
            <img src="images/shoe6.jpeg" class="thumb">
            <img src="images/shoe7.jpeg" class="thumb">
        </div>
    </div>

</body>
<script src="./script.js"></script>
</html>
